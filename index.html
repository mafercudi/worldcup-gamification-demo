<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mundial Fan Challenge</title>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app-shell">
    <header class="mobile-header">
      <div class="brand-area">
        <img id="brand-logo" src="" alt="Logo de la marca" />
      </div>

      <a class="admin-link" href="./admin.html">Admin</a>
    </header>

    <section class="game-screen">
      <div class="hero-copy">
        <p class="eyebrow" id="campaign-eyebrow">Matchday Game</p>
        <h1 id="campaign-title">Mundial Fan Challenge</h1>
        <p id="campaign-subtitle">
          Elige tu selección, gira la ruleta y gana puntos.
        </p>
      </div>

      <section class="team-section" id="teams">
        <label class="team-search-label">
          Selecciona el país que apoyas
          <input id="team-search" type="text" placeholder="Buscar país..." />
        </label>

        <div id="team-selector" class="team-selector"></div>
      </section>

      <section class="wheel-section" id="game">
        <div class="score-row">
          <div>
            <span id="metric-team">—</span>
            <small>Equipo</small>
          </div>

          <div>
            <span id="metric-score">0</span>
            <small>Puntos</small>
          </div>

          <div>
            <span id="metric-segment">—</span>
            <small>Segmento</small>
          </div>
        </div>

        <div class="wheel-card">
          <div class="pointer"></div>
          <div class="wheel-container"></div>
        </div>

        <button id="spin-btn" class="primary-btn" disabled>
          Selecciona un país para girar
        </button>

        <div id="result-card" class="result-card hidden">
          <p class="result-label">Resultado</p>
          <h3 id="result-title"></h3>
          <p id="result-description"></p>

          <button id="return-whatsapp-btn" class="secondary-btn">
            Volver a WhatsApp
          </button>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/spin-wheel@5.0.2/dist/spin-wheel-iife.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>

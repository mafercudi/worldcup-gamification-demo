<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mundial Fan Challenge</title>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="game-body">
  <main class="game-app">
    <section class="game-card">
      <div class="brand-row">
        <img id="brand-logo" src="" alt="Logo de la marca" />
        <a href="./admin.html" class="admin-link">Admin</a>
      </div>

      <div class="intro">
        <p id="campaign-eyebrow" class="eyebrow">MATCHDAY GAME</p>
        <h1 id="campaign-title">Gira la ruleta</h1>
        <p id="campaign-subtitle">Elige tu selección y gana puntos.</p>
      </div>

      <div class="team-block">
        <label for="team-search">Selecciona tu país</label>
        <input id="team-search" type="text" placeholder="Buscar país..." />
        <div id="team-selector" class="team-selector"></div>
      </div>

      <div class="score-row">
        <div>
          <strong id="metric-team">—</strong>
          <span>Equipo</span>
        </div>

        <div>
          <strong id="metric-score">0</strong>
          <span>Puntos</span>
        </div>
      </div>

      <div class="wheel-card">
        <div class="pointer"></div>
        <div class="wheel-container"></div>
      </div>

      <button id="spin-btn" class="primary-btn" disabled>
        Selecciona un país para girar
      </button>

      <div id="result-card" class="result-card hidden">
        <p class="result-label">Resultado</p>
        <h2 id="result-title"></h2>
        <p id="result-description"></p>

        <button id="return-whatsapp-btn" class="secondary-btn">
          Volver a WhatsApp
        </button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/spin-wheel@5.0.2/dist/spin-wheel-iife.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin | Mundial Fan Challenge</title>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="admin-body">
  <main class="admin-app">
    <section class="admin-card">
      <h1>Admin demo</h1>
      <p>Edita marca, colores, campaña y payload mínimo.</p>

      <div class="admin-preview">
        <img id="admin-logo-preview" src="" alt="Logo preview" />
      </div>

      <label>
        Nombre de marca
        <input id="brand-name" type="text" />
      </label>

      <label>
        URL del logo
        <input id="brand-logo" type="text" />
      </label>

      <div class="color-grid">
        <label>
          Fondo
          <input id="brand-bg" type="color" />
        </label>

        <label>
          Principal
          <input id="brand-primary" type="color" />
        </label>

        <label>
          Secundario
          <input id="brand-secondary" type="color" />
        </label>

        <label>
          Acento
          <input id="brand-accent" type="color" />
        </label>
      </div>

      <label>
        Campaign ID
        <input id="campaign-id" type="text" />
      </label>

      <label>
        Campaign Name
        <input id="campaign-name" type="text" />
      </label>

      <label>
        Source
        <input id="campaign-source" type="text" />
      </label>

      <label>
        WhatsApp return phone
        <input id="return-phone" type="text" />
      </label>

      <label>
        WhatsApp return message
        <input id="return-message" type="text" />
      </label>

      <label class="checkbox-label">
        <input id="endpoint-enabled" type="checkbox" />
        Activar endpoint
      </label>

      <label>
        Endpoint URL
        <input id="endpoint-url" type="text" placeholder="https://..." />
      </label>

      <label>
        Payload base
        <textarea id="payload-editor"></textarea>
      </label>

      <button id="save-config-btn" class="primary-btn">
        Guardar configuración
      </button>

      <button id="open-game-btn" class="secondary-btn">
        Abrir juego
      </button>

      <button id="reset-config-btn" class="danger-btn">
        Resetear
      </button>

      <h2>URL generada</h2>
      <pre id="generated-url"></pre>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
